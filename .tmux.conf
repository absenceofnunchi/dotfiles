# # =============================================
# KEY BINDING CONFIGURATION
# =============================================

# Change the default prefix from Control + b to Control + s
unbind C-b
set-option -g prefix C-s
bind C-s send-prefix

# Keybindings with new prefix (Control + s):

# Create a new session
# bind-key : command-prompt -p "New session name:" "new-session -s '%%'"

# List all sessions
bind-key s choose-session

# List all windows (also shows sessions)
# bind-key w choose-window
bind-key w run-shell "tmux resize-pane -Z; tmux choose-window; tmux resize-pane -Z"

# Create a new window
bind-key c new-window

# Switch to a specific window (0-9)
bind-key 0 select-window -t 0
bind-key 1 select-window -t 1
bind-key 2 select-window -t 2
bind-key 3 select-window -t 3
bind-key 4 select-window -t 4
bind-key 5 select-window -t 5
bind-key 6 select-window -t 6
bind-key 7 select-window -t 7
bind-key 8 select-window -t 8
bind-key 9 select-window -t 9

# Go to the next window
bind-key n next-window

# Go to the previous window
bind-key p previous-window

# Kill the current window
bind-key & confirm-before -p "Kill window #W? (y/n)" kill-window

# View all windows (same as w)
bind-key w choose-window

# Keybindings for session management

# Keybinding to create a new session (e.g., Control + s + n)
bind-key e command-prompt -p "New session name:" "new-session -s '%%'"  # Create a new session

# Keybinding to switch to a session (e.g., Control + s + s)
bind-key s choose-session                                              # Switch to a session

bind-key K command-prompt -p "Kill session:" "kill-session -t '%%'"    # Kill a session

# Vim-style pane navigation (Control + s + h/j/k/l)
bind-key h select-pane -L  # Move to the pane on the left
bind-key j select-pane -D  # Move to the pane below
bind-key k select-pane -U  # Move to the pane above
bind-key l select-pane -R  # Move to the pane on the right

