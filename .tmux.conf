# Set terminal color support
set -g default-terminal "tmux-256color"
set-option -sa terminal-features ',xterm-256color:RGB'
set -as terminal-overrides ',*:Tc'
# Keep SSH agent variables updated for new panes/popups/clients
set -g update-environment "DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION SSH_TTY"

# =============================================
# THEME CONFIGURATION
# =============================================


### Dotbar — static tmux.conf version

# colors
set -g @tmux-dotbar-bg "default"
set -g @tmux-dotbar-fg "#475266"
set -g @tmux-dotbar-fg-current "#BFBDB6"
set -g @tmux-dotbar-fg-session "#565B66"
set -g @tmux-dotbar-fg-prefix "#95E6CB"

### Status bar placement + style
set -g status-position "bottom"
set -g status-style "bg=default,fg=#475266"
set -g status-justify "absolute-centre"

### LEFT side (enabled by default)
set -g status-left "#[bg=default,fg=#565B66]#{?client_prefix,, #S }#[bg=#95E6CB,fg=default,bold]#{?client_prefix, #S ,}#[bg=default,fg=#565B66]"

### RIGHT side (disabled by default → empty)
set -g status-right ""

### Window list
set -g window-status-separator " • "
set -g window-status-style "bg=default,fg=#475266"
set -g window-status-format " #W "

### Bell + activity styles
set -g window-status-bell-style "bg=#95E6CB,fg=default,bold"
set -g window-status-activity-style "bg=#BFBDB6,fg=default"

### Current window (non-bold version)
set -g window-status-current-format "#{?#{||:#{window_bell_flag},#{window_activity_flag}},#[default],#[bg=default,fg=#BFBDB6]} #W #[fg=#39BAE6,bg=default]#{?window_zoomed_flag,󰊓,}#[fg=default,bg=default]"

# Define colors
BG_COLOR="#1A1D23"
ACTIVE_COLOR="#b4befe"
INACTIVE_COLOR="#6c7086"
TEXT_COLOR="#cdd6f4"
ACCENT_COLOR="#b4befe"

