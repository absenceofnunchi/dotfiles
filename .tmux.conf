##### Display Popup ####

bind c-y display-popup \
  -d "#{pane_current_path}" \
  -w 85% \
  -h 85% \
  -E "zsh -c 'source ~/.zshrc && y'"

bind C-j display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"

bind C-z display-popup \
  -w 85% \
  -h 85% \
  -E 'nvim ~/.zshrc'

bind C-t display-popup \
  -d "#{pane_current_path}" \
  -w 85% \
  -h 85% \
  -E "zsh"

bind C-v display-popup \
  -w 85% \
  -h 85% \
  -E 'zsh -ic "/opt/homebrew/bin/vimo"'

bind C-g display-popup \
  -w 85% \
  -h 85% \
  -d '#{pane_current_path}' \
  -E 'lazygit'

#### Display Menu ####

bind d display-menu -T "#[align=centre]Dotfiles" -x C -y C \
  ".zshrc"            z  "display-popup -E 'nvim ~/.zshrc'; source-file ~/.zshrc" \
  ".tmux.conf"        t  "display-popup -E 'nvim ~/.tmux.conf'; source-file ~/.tmux.conf" \
  ".config/nvim"      n  "display-popup '$SHELL -c \"nvim ~/.config/nvim/; exec $SHELL\"'" \
  ".config/yazi"      y  "display-popup -E 'nvim ~/.config/yazi/'" \
  ".config/aerospace" a  "display-popup -E 'nvim ~/.config/aerospace/aerospace.toml'" \
  ".ssh"              s  "display-popup -E 'nvim ~/.ssh/'" \
  "Exit"              q  ""

# Set the status bar color to be white on a gray background
# set -g status-style "fg=white bg=color237"
set -g status-style "fg=white bg=default"
set-option -g status-right ""

#### How to restart after re-configuration ####

# tmux source-file ~/.tmux.conf

#### Reference ####

# https://github.com/ericmckevitt/Dotfiles/blob/main/tmux.conf

# OSC 52 passthrough
set -g set-clipboard on
set -g allow-passthrough on
