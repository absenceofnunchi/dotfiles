# =============================================
# GENERAL
# =============================================

# Terminal color support
set -g default-terminal "tmux-256color"
set-option -sa terminal-features ',xterm-256color:RGB'
set -as terminal-overrides ',*:Tc'
set -as terminal-features ',xterm-kitty:RGB:hyperlinks:sync'

# Keep SSH agent variables updated for new panes/popups/clients
set -g update-environment "DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION SSH_TTY"

# Behaviour
set -sg escape-time 0
set -g history-limit 50000
# Claude Code panes render in the normal buffer (alternate-screen off) so their
# output flows into scrollback and `prefix + [` can scroll back through it — but
# PANE-scoped, set by the claude launchers (add-claude-pane.sh + sesh launch-*.sh),
# NOT global. A global `off` routed every nvim full-screen redraw into pane
# history (50k-line cap, every pane), bloating the single-threaded tmux server to
# ~380MB until it swapped out and froze all panes for seconds at a time (June
# 2026). Globally the alternate screen stays on, so pagers/editors (less, man,
# git pager, nvim) behave normally.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
set -g focus-events on

# Claude Code
set -g mouse on

# Clipboard / OSC 52 passthrough
set -g set-clipboard on
set -g allow-passthrough all

# claude
set -as terminal-features 'xterm*:extkeys'

# =============================================
# THEME
# =============================================

%hidden BG_COLOR="#1A1D23"
# %hidden ACTIVE_COLOR="#b4befe"
%hidden ACTIVE_COLOR="#666666"
# %hidden INACTIVE_COLOR="#6c7086"
%hidden INACTIVE_COLOR="#3b3b3b"
# %hidden TEXT_COLOR="#cdd6f4"
%hidden TEXT_COLOR="#3b3b3b"
# %hidden ACCENT_COLOR="#b4befe"
%hidden ACCENT_COLOR="#3b3b3b"

# Status bar
set -g status on
set -g status-position bottom
set -g status-interval 3
set -g status-justify left
set -g status-style "bg=default,fg=$TEXT_COLOR"
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#[fg=$ACCENT_COLOR,bold]  #S #[fg=$INACTIVE_COLOR]│ "
set -g status-right ""

# Window status
set -g window-status-format "#[fg=$INACTIVE_COLOR,bg=default] #I:#W "
set -g window-status-current-format "#[fg=$ACTIVE_COLOR,bg=$BG_COLOR,bold] #I:#W "
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#5c6370"
set -g pane-active-border-style "fg=#61afef"

# Messages
set -g message-style "bg=$BG_COLOR,fg=$TEXT_COLOR,bold"
set -g message-command-style "bg=$BG_COLOR,fg=$TEXT_COLOR,bold"

# =============================================
# KEY BINDINGS
# =============================================

# Prefix: Ctrl+s
unbind C-b
set-option -g prefix C-s
bind C-s send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# Sessions
bind-key e command-prompt -p "New session name:" "new-session -s '%%' -c '~'"
bind-key s choose-session

# Windows
bind-key c new-window -c "#{pane_current_path}"
bind-key n next-window
bind-key p previous-window
bind-key & confirm-before -p "Kill window #W? (y/n)" kill-window
bind-key w run-shell "tmux resize-pane -Z; tmux choose-window; tmux resize-pane -Z"

# Splits — open in current pane's directory
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"

# Jump to window 1-9 (base-index = 1, so no 0)
bind-key 1 select-window -t 1
bind-key 2 select-window -t 2
bind-key 3 select-window -t 3
bind-key 4 select-window -t 4
bind-key 5 select-window -t 5
bind-key 6 select-window -t 6
bind-key 7 select-window -t 7
bind-key 8 select-window -t 8
bind-key 9 select-window -t 9

# Vim-style pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Swap panes (tmux defaults — moved off K/J to avoid case-sensitivity confusion with j/k nav)
bind-key '{' swap-pane -U
bind-key '}' swap-pane -D

# Vi copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# =============================================
# POPUPS
# =============================================

# Yazi file manager — opens in a REAL window, intentionally NOT a display-popup.
# Yazi auto-detects tmux from its XTVERSION reply, then runs a terminal-detection
# probe wrapped in tmux passthrough. Inside a display-popup the terminal's reply
# can't route back, so the probe times out (TRT) and crashes the tmux server. A
# real window routes passthrough correctly — image previews work, nothing crashes.
# (See yazi#2308. Do NOT revert this to display-popup.)
bind C-y new-window -c "#{pane_current_path}" -n yazi "/opt/homebrew/bin/yazi"

bind C-j display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"

bind C-z display-popup \
  -w 90% \
  -h 90% \
  -E 'nvim ~/.zshrc'

bind C-t display-popup \
  -d "#{pane_current_path}" \
  -w 90% \
  -h 90% \
  -E "zsh"

bind C-v display-popup \
  -w 90% \
  -h 90% \
  -E 'zsh -ic "vimo"'

bind C-g display-popup \
  -w 90% \
  -h 90% \
  -d '#{pane_current_path}' \
  -E 'lazygit'

# Capture — jot a task into the vault inbox from ANY session. Prefix is global, so
# <prefix> i works everywhere. One line in, filed with today's [do::] so it lands in
# today's agenda and rolls forward until done. "Capture must be faster than the thought."
bind i display-popup \
  -w 60% \
  -h 20% \
  -E '/Users/gin/.config/sesh/capture.sh'

# =============================================
# DOTFILES MENU
# =============================================

bind d display-menu -T "#[align=centre]Dotfiles" -x C -y C \
  ".zshrc"            z  "display-popup -E 'nvim ~/.zshrc'; source-file ~/.zshrc" \
  ".tmux.conf"        t  "display-popup -E 'nvim ~/.tmux.conf'; source-file ~/.tmux.conf" \
  ".config/nvim"      n  "display-popup -E 'nvim ~/.config/nvim/'" \
  ".config/yazi"      y  "display-popup -E 'nvim ~/.config/yazi/'" \
  ".sesh"             s  "display-popup -E 'nvim ~/.config/sesh/'" \
  ".config/aerospace" a  "display-popup -E 'nvim ~/.config/aerospace/aerospace.toml'" \
  ".ssh"              h  "display-popup -E 'nvim ~/.ssh/'" \
  "Exit"              q  ""

# =============================================
# CLAUDE PANE
# =============================================

# prefix + C : split current window side-by-side and launch Claude Code on the right
bind -N "split + launch claude code" C run-shell "~/.config/sesh/add-claude-pane.sh"

# >>> sesh begin >>>
# Managed block. To remove sesh: run ~/.config/sesh/uninstall.sh (deletes this block).

# Stay in tmux when a session is destroyed (lets `sesh last` find a previous session)
set -g detach-on-destroy off

# prefix + T : sesh picker (all sources, with hotkeys to filter)
bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️   )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# prefix + Control + k: key bind for prefix + T
bind-key C-k run-shell "sesh connect \"$(sesh list | fzf-tmux -p 55%,60%)\""

# prefix + L : jump to the last session (sesh's variant survives session-kill)
bind -N "last-session (via sesh)" L run-shell "sesh last"
# <<< sesh end <<<

# Reference: https://github.com/ericmckevitt/Dotfiles/blob/main/tmux.conf
# Reload manually: tmux source-file ~/.tmux.conf  (or prefix + r)
# Archived alternative configs: ~/.tmux.conf.archive

# =============================================
# PLUGINS (tpm)
# =============================================
#
# Bootstrap (one-time):
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#
# After editing this section, reload with `prefix + r`, then `prefix + I`
# (capital i) to fetch any newly added plugins.
#
# Plugin manager itself
set -g @plugin 'tmux-plugins/tpm'
#
# tmux-resurrect: save/restore sessions, windows, panes, layouts, working dirs
#   prefix + Ctrl-s   save now
#   prefix + Ctrl-r   restore last save
set -g @plugin 'tmux-plugins/tmux-resurrect'
#
# tmux-continuum: automated periodic save + auto-restore on tmux server start
set -g @plugin 'tmux-plugins/tmux-continuum'

# --- resurrect tuning ---
# Restore nvim sessions if a Session.vim exists (requires :mksession in nvim)
set -g @resurrect-strategy-nvim 'session'
# Save the visible scrollback of each pane alongside the layout
set -g @resurrect-capture-pane-contents 'on'

# --- continuum tuning ---
# Auto-save interval in minutes (default 15)
set -g @continuum-save-interval '15'
# Auto-restore the last saved environment when the tmux server starts
set -g @continuum-restore 'on'

# Initialize tpm — KEEP THIS LINE AT THE VERY BOTTOM OF THE FILE
run '~/.tmux/plugins/tpm/tpm'
